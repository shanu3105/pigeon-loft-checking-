
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Waste Segregation System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #f1f5f9; }
        @keyframes wasteDrop {
          0% { top: 80px; transform: translateX(0) scale(0.8); opacity: 0; }
          20% { opacity: 1; transform: translateX(0) scale(1); }
          40% { top: 200px; transform: translateX(0) scale(1); }
          100% { top: 450px; transform: translateX(var(--tx)) scale(0.6); opacity: 0; }
        }
        .animate-waste-drop {
          animation: wasteDrop 1.2s cubic-bezier(0.45, 0, 0.55, 1) forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICON COMPONENTS (Inline for portability) ---
        const Icon = ({ path, color = "currentColor", size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            Cpu: (p) => <Icon {...p} path={<><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></>} />,
            Wifi: (p) => <Icon {...p} path={<><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></>} />,
            Camera: (p) => <Icon {...p} path={<><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></>} />,
            RefreshCw: (p) => <Icon {...p} path={<><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></>} />,
            Settings: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></>} />,
            Apple: (p) => <Icon {...p} path={<><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"></path><path d="M10 2c1 .5 2 2 2 5"></path></>} />,
            Battery: (p) => <Icon {...p} path={<><rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="23" y1="13" x2="23" y2="11"></line></>} />,
            Box: (p) => <Icon {...p} path={<><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></>} />,
            Sparkles: (p) => <Icon {...p} path={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></>} />,
            X: (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></>} />,
            Radio: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path></>} />
        };

        const ProjectWasteSystem = () => {
          // --- SYSTEM STATE ---
          const [apiKey, setApiKey] = useState("");
          const [servoAngle, setServoAngle] = useState(120); // Neutral Center
          const [systemState, setSystemState] = useState('IDLE'); // IDLE, PROCESSING, ACTUATING, DEPOSITING
          
          // --- SENSOR DATA ---
          const [binLevels, setBinLevels] = useState({ organic: 15, inorganic: 30, hazardous: 5 }); 
          const [totalWeight, setTotalWeight] = useState(124); 
          const [lastSorted, setLastSorted] = useState(null);

          // --- SIMULATION STATE ---
          const [fallingItems, setFallingItems] = useState([]);
          const [cameraInput, setCameraInput] = useState('');
          const [aiAnalysis, setAiAnalysis] = useState(null);
          
          // --- REPORTING STATE ---
          const [sessionLog, setSessionLog] = useState([]);
          const [reportData, setReportData] = useState(null);
          const [isGeneratingReport, setIsGeneratingReport] = useState(false);

          // --- CONFIGURATION ---
          const ANGLE_CONFIG = { ORGANIC: 60, INORGANIC: 120, HAZARDOUS: 180 };

          const getVisualRotation = (angle) => {
            if (angle === ANGLE_CONFIG.ORGANIC) return -40;
            if (angle === ANGLE_CONFIG.HAZARDOUS) return 40;
            return 0;
          };

          // --- AI LOGIC (GEMINI) ---
          const handleScan = async () => {
            if (!cameraInput.trim() || systemState !== 'IDLE') return;

            setSystemState('PROCESSING');
            setAiAnalysis({ loading: true });

            try {
              // Simulate Processing Time
              await new Promise(r => setTimeout(r, 600));

              if (!apiKey) throw new Error("API Key Missing");

              const prompt = `
                Act as the ESP32 Controller for a Smart Waste Segregation System.
                Classify the object "${cameraInput}" into one of these 3 bins:
                1. ORGANIC (Food, biodegradable)
                2. INORGANIC (Plastic, paper, glass, metal)
                3. HAZARDOUS (E-waste, batteries, chemicals, medical)
                Also estimate weight in grams.
                Response Format:
                Category: [Organic/Inorganic/Hazardous]
                Weight: [number]
                Reason: [Very short reason]
              `;

              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
                }
              );

              const data = await response.json();
              if (data.error) throw new Error(data.error.message);
              
              const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
              const catMatch = text.match(/Category:\s*(Organic|Inorganic|Hazardous)/i);
              const weightMatch = text.match(/Weight:\s*(\d+)/);
              const reasonMatch = text.match(/Reason:\s*(.*)/);

              if (catMatch) {
                const category = catMatch[1].toUpperCase();
                const weight = weightMatch ? parseInt(weightMatch[1]) : 50;
                const reason = reasonMatch ? reasonMatch[1] : "Detected by Model";
                setAiAnalysis({ category, weight, reason, loading: false });
                executeSortingSequence(category, weight, cameraInput);
              } else {
                throw new Error("Failed to classify");
              }
            } catch (e) {
              console.error(e);
              alert(e.message === "API Key Missing" ? "Please enter your Gemini API Key at the top!" : "AI Error: " + e.message);
              setSystemState('ERROR');
              setTimeout(() => setSystemState('IDLE'), 2000);
              setAiAnalysis(null);
            }
          };

          const executeSortingSequence = (category, weight, itemName) => {
            setSystemState('ACTUATING');
            let targetAngle = ANGLE_CONFIG.INORGANIC;
            if (category === 'ORGANIC') targetAngle = ANGLE_CONFIG.ORGANIC;
            if (category === 'HAZARDOUS') targetAngle = ANGLE_CONFIG.HAZARDOUS;

            setServoAngle(targetAngle);

            setTimeout(() => {
              setSystemState('DEPOSITING');
              spawnFallingItem(category, itemName);
              setTotalWeight(prev => prev + weight);
              setLastSorted(category);
              setBinLevels(prev => {
                const key = category.toLowerCase();
                return { ...prev, [key]: Math.min(prev[key] + 5, 100) };
              });
              setSessionLog(prev => [...prev, { name: itemName, category, weight, time: new Date() }]);

              setTimeout(() => {
                setCameraInput('');
                setServoAngle(ANGLE_CONFIG.INORGANIC);
                setSystemState('IDLE');
                setAiAnalysis(null);
              }, 1500);
            }, 800);
          };

          const spawnFallingItem = (category, name) => {
            const id = Date.now();
            setFallingItems(prev => [...prev, { id, category, name }]);
            setTimeout(() => {
              setFallingItems(prev => prev.filter(i => i.id !== id));
            }, 1200);
          };

          const generateReport = async () => {
            if (sessionLog.length === 0) return;
            setIsGeneratingReport(true);
            setReportData(null);
            try {
                if (!apiKey) throw new Error("API Key Missing");
                const logStr = sessionLog.map(i => `${i.name} (${i.category})`).join(', ');
                const prompt = `Analyze this waste session: ${logStr}. Give a Sustainability Score (0-100) and one specific eco-tip. Format: Score: [num] Tip: [text]`;
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) }
                );
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                const score = text.match(/Score:\s*(\d+)/)?.[1] || "85";
                const tip = text.match(/Tip:\s*(.*)/)?.[1] || "Reduce, Reuse, Recycle!";
                setReportData({ score, tip });
            } catch (e) {
                alert("Report Error: " + e.message);
            } finally {
                setIsGeneratingReport(false);
            }
          };

          const getIcon = (cat) => {
            if (cat === 'ORGANIC') return <Icons.Apple size={20} className="text-green-600" />;
            if (cat === 'HAZARDOUS') return <Icons.Battery size={20} className="text-red-600" />;
            return <Icons.Box size={20} className="text-blue-600" />;
          };

          const getDropStyle = (category) => {
            let xOffset = 0;
            if (category === 'ORGANIC') xOffset = -100;
            if (category === 'HAZARDOUS') xOffset = 100;
            return { '--tx': `${xOffset}px` };
          };

          return (
            <div className="min-h-screen bg-slate-100 p-4 font-sans text-slate-800 flex flex-col items-center">
              
              {/* API KEY INPUT */}
              <div className="w-full max-w-6xl mb-2 bg-yellow-50 border border-yellow-200 p-2 rounded flex items-center justify-between text-sm">
                <span className="font-bold text-yellow-800 flex items-center gap-2">🔑 API CONFIG:</span>
                <input 
                    type="password" 
                    placeholder="Paste Gemini API Key Here" 
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    className="flex-1 ml-4 p-1 border rounded"
                />
              </div>

              {/* HEADER */}
              <div className="w-full max-w-6xl mb-6 flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div>
                  <h1 className="text-2xl font-black text-slate-900 tracking-tight">SMART WASTE SEGREGATION SYSTEM</h1>
                  <p className="text-slate-500 text-sm font-mono flex items-center gap-2">
                    <Icons.Cpu size={14}/> ESP32 CONTROLLED <span className="text-slate-300">|</span> <Icons.Wifi size={14} className="text-green-500"/> ONLINE
                  </p>
                </div>
                <div className="flex gap-4 mt-4 md:mt-0">
                   <div className="text-right">
                     <div className="text-xs text-slate-400 font-bold uppercase">System Status</div>
                     <div className={`font-mono font-bold ${systemState === 'IDLE' ? 'text-green-600' : 'text-amber-500'}`}>
                       {systemState}
                     </div>
                   </div>
                   <div className="h-8 w-px bg-slate-200"></div>
                   <div className="text-right">
                     <div className="text-xs text-slate-400 font-bold uppercase">Total Load</div>
                     <div className="font-mono font-bold text-slate-800">{totalWeight}g</div>
                   </div>
                </div>
              </div>

              {/* MAIN CONTENT GRID */}
              <div className="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                {/* --- LEFT COLUMN --- */}
                <div className="lg:col-span-4 flex flex-col gap-4">
                  
                  {/* CAMERA FEED */}
                  <div className="bg-slate-900 rounded-xl overflow-hidden shadow-lg border-2 border-slate-700 flex flex-col h-64 relative">
                     <div className="bg-slate-800 p-2 flex justify-between items-center text-xs text-slate-400 font-mono border-b border-slate-700">
                       <span className="flex items-center gap-2 text-red-500 font-bold"><Icons.Radio size={12} className="animate-pulse"/> LIVE FEED</span>
                       <span>CAM_OV2640</span>
                     </div>
                     <div className="flex-1 relative bg-black flex items-center justify-center p-4">
                        <div className="absolute inset-0 opacity-20 pointer-events-none">
                          <div className="absolute top-1/2 left-0 w-full h-px bg-green-500"></div>
                          <div className="absolute left-1/2 top-0 h-full w-px bg-green-500"></div>
                          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 border border-green-500 rounded"></div>
                        </div>
                        {aiAnalysis && (
                          <div className="z-10 bg-slate-800/90 backdrop-blur border border-slate-600 rounded-lg p-3 text-center">
                             {aiAnalysis.loading ? (
                               <Icons.RefreshCw className="animate-spin text-green-400 mx-auto" size={24}/>
                             ) : (
                               <>
                                 <div className={`text-lg font-black ${
                                   aiAnalysis.category === 'ORGANIC' ? 'text-green-400' : 
                                   aiAnalysis.category === 'HAZARDOUS' ? 'text-red-400' : 'text-blue-400'
                                 }`}>
                                   {aiAnalysis.category}
                                 </div>
                                 <div className="text-xs text-slate-400 mt-1">{aiAnalysis.reason}</div>
                               </>
                             )}
                          </div>
                        )}
                     </div>
                     <div className="p-3 bg-slate-800 border-t border-slate-700">
                       <div className="flex gap-2">
                         <input 
                           value={cameraInput}
                           onChange={(e) => setCameraInput(e.target.value)}
                           onKeyDown={(e) => e.key === 'Enter' && handleScan()}
                           disabled={systemState !== 'IDLE'}
                           placeholder="Type object (e.g., Apple, Battery)..." 
                           className="flex-1 bg-slate-900 border border-slate-600 rounded px-3 py-1 text-sm text-white focus:border-green-500 outline-none"
                         />
                         <button 
                           onClick={handleScan}
                           disabled={systemState !== 'IDLE' || !cameraInput}
                           className="bg-green-600 hover:bg-green-500 text-white px-3 rounded text-sm font-bold flex items-center gap-1 disabled:opacity-50"
                         >
                           <Icons.Camera size={14}/> SCAN
                         </button>
                       </div>
                     </div>
                  </div>

                  {/* SENSOR DASHBOARD */}
                  <div className="bg-black rounded-xl p-4 shadow-lg border-4 border-gray-800 relative overflow-hidden">
                     <div className="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent pointer-events-none"></div>
                     <div className="font-mono text-cyan-400 text-sm mb-2 pb-2 border-b border-cyan-900 flex justify-between">
                        <span>SSD1306 OLED</span>
                        <span>I2C 0x3C</span>
                     </div>
                     <div className="space-y-3 font-mono">
                        <div className="flex justify-between items-center text-cyan-300">
                           <span className="text-xs">SERVO (GPIO25)</span>
                           <span className="font-bold">{servoAngle}°</span>
                        </div>
                        <div className="w-full bg-cyan-900/30 h-1.5 rounded-full overflow-hidden">
                           <div className="h-full bg-cyan-400 transition-all duration-300" style={{ width: `${(servoAngle/180)*100}%` }}></div>
                        </div>
                        <div className="grid grid-cols-3 gap-2 mt-4 text-center">
                           <div className="bg-cyan-900/20 rounded p-1 border border-cyan-900/50">
                              <div className="text-[10px] text-cyan-500">ORG</div>
                              <div className="text-lg font-bold text-green-400">{binLevels.organic}%</div>
                           </div>
                           <div className="bg-cyan-900/20 rounded p-1 border border-cyan-900/50">
                              <div className="text-[10px] text-cyan-500">INO</div>
                              <div className="text-lg font-bold text-blue-400">{binLevels.inorganic}%</div>
                           </div>
                           <div className="bg-cyan-900/20 rounded p-1 border border-cyan-900/50">
                              <div className="text-[10px] text-cyan-500">HAZ</div>
                              <div className="text-lg font-bold text-red-400">{binLevels.hazardous}%</div>
                           </div>
                        </div>
                     </div>
                  </div>

                  {/* AI REPORTING PANEL */}
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex-1">
                     <div className="flex justify-between items-center mb-3">
                       <h3 className="font-bold text-slate-700 flex items-center gap-2"><Icons.Sparkles size={16} className="text-purple-500"/> Project Insights</h3>
                       {reportData && <button onClick={() => setReportData(null)}><Icons.X size={14} className="text-slate-400"/></button>}
                     </div>
                     {!reportData ? (
                       <div className="text-center py-4">
                         <p className="text-xs text-slate-500 mb-3">Sorted {sessionLog.length} items this session.</p>
                         <button onClick={generateReport} disabled={sessionLog.length === 0 || isGeneratingReport} className="w-full py-2 bg-purple-50 text-purple-700 rounded-lg text-xs font-bold border border-purple-200 hover:bg-purple-100 transition-colors disabled:opacity-50">
                           {isGeneratingReport ? "Analyzing Data..." : "Generate AI Audit"}
                         </button>
                       </div>
                     ) : (
                       <div className="animate-in slide-in-from-bottom-2 fade-in">
                          <div className="flex items-center gap-3 mb-3">
                             <div className="text-3xl font-black text-slate-800">{reportData.score}</div>
                             <div className="text-xs text-slate-500 leading-tight">Sustainability<br/>Score</div>
                          </div>
                          <div className="p-2 bg-green-50 rounded border border-green-100 text-xs text-green-800 italic">"{reportData.tip}"</div>
                       </div>
                     )}
                  </div>
                </div>

                {/* --- RIGHT COLUMN --- */}
                <div className="lg:col-span-8 flex flex-col">
                  <div className="flex-1 bg-gradient-to-b from-gray-100 to-gray-200 rounded-2xl shadow-xl border-4 border-white relative overflow-hidden min-h-[500px] flex flex-col">
                     {/* 1. TOP MECHANISM */}
                     <div className="h-40 relative z-20 flex justify-center items-start pt-4 pointer-events-none">
                        <div className="relative z-30 flex flex-col items-center">
                           <div className="w-20 h-14 bg-blue-600 rounded border-b-4 border-blue-800 shadow-xl flex items-center justify-center relative">
                              <span className="text-yellow-300 font-bold text-[10px] bg-blue-800 px-1 rounded">SG90</span>
                              <div className="absolute -right-8 top-4 w-8 h-4 flex flex-col gap-0.5">
                                 <div className="h-0.5 w-full bg-red-500"></div>
                                 <div className="h-0.5 w-full bg-orange-500"></div>
                                 <div className="h-0.5 w-full bg-amber-900"></div>
                              </div>
                           </div>
                           <div className="w-4 h-4 bg-white rounded-full -mt-2 z-40 shadow-sm border border-gray-300"></div>
                        </div>
                        <div className="absolute top-16 transition-transform duration-500 ease-out origin-top" style={{ transform: `rotate(${getVisualRotation(servoAngle)}deg)`, filter: 'drop-shadow(0 4px 6px rgba(0,0,0,0.2))' }}>
                           <div className="w-64 h-24 relative">
                              <div className="w-full h-full bg-gradient-to-b from-slate-300 via-slate-400 to-slate-500" style={{ clipPath: 'polygon(10% 0, 90% 0, 100% 100%, 0 100%)', borderRadius: '4px' }}>
                                   <div className="absolute top-0 left-1/2 -translate-x-1/2 w-0.5 h-full bg-slate-400/50"></div>
                              </div>
                           </div>
                        </div>
                     </div>

                     {/* 2. FALLING ITEMS */}
                     <div className="absolute inset-0 z-10 pointer-events-none">
                        {fallingItems.map(item => (
                          <div key={item.id} className="absolute top-20 left-1/2 -translate-x-1/2 animate-waste-drop" style={getDropStyle(item.category)}>
                            <div className="bg-white p-3 rounded-full shadow-lg border border-slate-200">{getIcon(item.category)}</div>
                            <div className="bg-slate-800 text-white text-[10px] px-2 py-0.5 rounded-full absolute -top-2 left-1/2 -translate-x-1/2 whitespace-nowrap shadow-sm">{item.name}</div>
                          </div>
                        ))}
                     </div>

                     {/* 3. BINS */}
                     <div className="flex-1 flex items-end px-8 pb-8 gap-4 z-0">
                        {/* ORGANIC BIN */}
                        <div className="flex-1 h-[320px] flex flex-col relative group">
                           <div className="flex-1 bg-green-600 rounded-lg shadow-inner border-x-4 border-b-8 border-green-800 relative overflow-hidden flex flex-col justify-end">
                              <div className="bg-green-800/40 w-full transition-all duration-1000 border-t border-green-400/30 relative" style={{ height: `${binLevels.organic}%` }}></div>
                              <div className="absolute bottom-4 left-0 w-full text-center">
                                <span className="bg-black/20 text-white font-bold px-3 py-1 rounded text-sm tracking-wider backdrop-blur-sm">ORGANIC</span>
                              </div>
                           </div>
                        </div>
                        {/* INORGANIC BIN */}
                        <div className="flex-1 h-[320px] flex flex-col relative group">
                           <div className="flex-1 bg-blue-600 rounded-lg shadow-inner border-x-4 border-b-8 border-blue-800 relative overflow-hidden flex flex-col justify-end">
                              <div className="bg-blue-800/40 w-full transition-all duration-1000 border-t border-blue-400/30 relative" style={{ height: `${binLevels.inorganic}%` }}></div>
                              <div className="absolute bottom-4 left-0 w-full text-center">
                                <span className="bg-black/20 text-white font-bold px-3 py-1 rounded text-sm tracking-wider backdrop-blur-sm">INORGANIC</span>
                              </div>
                           </div>
                        </div>
                        {/* HAZARDOUS BIN */}
                        <div className="flex-1 h-[320px] flex flex-col relative group">
                           <div className="flex-1 bg-red-600 rounded-lg shadow-inner border-x-4 border-b-8 border-red-800 relative overflow-hidden flex flex-col justify-end">
                              <div className="bg-red-800/40 w-full transition-all duration-1000 border-t border-red-400/30 relative" style={{ height: `${binLevels.hazardous}%` }}></div>
                              <div className="absolute bottom-4 left-0 w-full text-center">
                                <span className="bg-black/20 text-white font-bold px-3 py-1 rounded text-sm tracking-wider backdrop-blur-sm">HAZARDOUS</span>
                              </div>
                           </div>
                        </div>
                     </div>
                     <div className="h-6 mx-6 bg-slate-600 rounded-sm mb-2 relative flex justify-center">
                        <div className="w-1/3 bg-green-500 h-1 mt-1 rounded-full"></div>
                     </div>
                  </div>

                  {/* MANUAL CONTROLS */}
                  <div className="mt-4 bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">
                     <div className="text-xs font-bold text-slate-400 uppercase flex items-center gap-2">
                        <Icons.Settings size={14}/> Manual Override
                     </div>
                     <div className="flex gap-2">
                        <button onClick={() => setServoAngle(60)} className="px-3 py-1 bg-slate-100 hover:bg-green-100 hover:text-green-700 rounded text-xs font-bold transition-colors">60° ORG</button>
                        <button onClick={() => setServoAngle(120)} className="px-3 py-1 bg-slate-100 hover:bg-blue-100 hover:text-blue-700 rounded text-xs font-bold transition-colors">120° INO</button>
                        <button onClick={() => setServoAngle(180)} className="px-3 py-1 bg-slate-100 hover:bg-red-100 hover:text-red-700 rounded text-xs font-bold transition-colors">180° HAZ</button>
                     </div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProjectWasteSystem />);
    </script>
</body>
</html>
